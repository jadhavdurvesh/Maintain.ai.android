name: Apply Android stability and customization

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[android-auto-patch]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Android source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/dmjgroup/maintainai/MainActivity.kt')
          s = p.read_text()

          # Safe imports.
          s = s.replace('import android.content.pm.PackageManager\n', 'import android.content.Context\nimport android.content.pm.PackageManager\n')
          s = s.replace('import androidx.compose.ui.text.font.FontWeight\n', 'import androidx.compose.ui.text.font.FontWeight\nimport androidx.compose.ui.text.style.TextAlign\n')
          s = s.replace('import androidx.compose.ui.unit.dp\n', 'import androidx.compose.ui.unit.dp\nimport androidx.compose.ui.unit.sp\n')
          s = s.replace('import com.dmjgroup.maintainai.data.*\n', 'import com.dmjgroup.maintainai.data.*\nimport com.google.gson.Gson\n')
          s = s.replace('import kotlinx.coroutines.delay\n', 'import kotlinx.coroutines.delay\nimport kotlinx.coroutines.sync.Mutex\nimport kotlinx.coroutines.sync.withLock\n')

          # Register notification permission once, before lifecycle STARTED.
          anchor = 'class MainActivity : ComponentActivity() {\n'
          launcher = 'class MainActivity : ComponentActivity() {\n    private val notificationPermissionLauncher = registerForActivityResult(ActivityResultContracts.RequestPermission()) {}\n'
          if 'private val notificationPermissionLauncher' not in s:
              s = s.replace(anchor, launcher, 1)
          old = '''        if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
            runCatching {
                registerForActivityResult(ActivityResultContracts.RequestPermission()) {}
                    .launch(Manifest.permission.POST_NOTIFICATIONS)
            }
        }'''
          new = '''        if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
            runCatching { notificationPermissionLauncher.launch(Manifest.permission.POST_NOTIFICATIONS) }
        }'''
          s = s.replace(old, new, 1)

          # Cache helpers.
          s = s.replace('private val TextMuted = Color(0xFF8FA1B8)\n', '''private val TextMuted = Color(0xFF8FA1B8)
private val Skeleton = Color(0xFF1A2940)
private const val CACHE_PREFS = "maintain_ai_cache"
private const val CACHE_DATA = "dashboard_data"
private const val CACHE_COMPACT = "compact_dashboard"
private const val CACHE_SHOW_AI = "show_ai_insights"
private const val CACHE_SYNC_SECONDS = "sync_interval_seconds"
private val gson = Gson()
''', 1)

          helper_anchor = 'class MainViewModel : ViewModel() {'
          helper = '''private fun loadCachedData(context: Context): DashboardData {
    val json = context.getSharedPreferences(CACHE_PREFS, Context.MODE_PRIVATE).getString(CACHE_DATA, null) ?: return DashboardData()
    return runCatching { gson.fromJson(json, DashboardData::class.java) }.getOrDefault(DashboardData())
}

private fun saveCachedData(context: Context, value: DashboardData) {
    runCatching {
        context.getSharedPreferences(CACHE_PREFS, Context.MODE_PRIVATE).edit()
            .putString(CACHE_DATA, gson.toJson(value)).apply()
    }
}

'''
          if 'private fun loadCachedData(context: Context)' not in s:
              s = s.replace(helper_anchor, helper + helper_anchor, 1)

          # Replace the fragile ViewModel init with a lifecycle-safe, cached, serialized sync loop.
          old_init = '    init { viewModelScope.launch { sync(true); while (isActive) { delay(10_000); sync(true) } } }'
          new_init = '''    private val syncMutex = Mutex()
    private var appContext: Context? = null
    private var initialized = false

    var compactMode by mutableStateOf(false); private set
    var showAiInsights by mutableStateOf(true); private set
    var syncIntervalSeconds by mutableIntStateOf(10); private set

    fun initialize(context: Context) {
        if (initialized) return
        initialized = true
        appContext = context.applicationContext
        val prefs = appContext!!.getSharedPreferences(CACHE_PREFS, Context.MODE_PRIVATE)
        data = loadCachedData(appContext!!)
        compactMode = prefs.getBoolean(CACHE_COMPACT, false)
        showAiInsights = prefs.getBoolean(CACHE_SHOW_AI, true)
        syncIntervalSeconds = prefs.getInt(CACHE_SYNC_SECONDS, 10).coerceIn(10, 60)
        lastUpdated = if (hasCachedData()) "Cached" else ""
        loading = !hasCachedData()
        viewModelScope.launch {
            sync(silent = true)
            while (isActive) {
                delay(syncIntervalSeconds * 1_000L)
                sync(silent = true)
            }
        }
    }

    private fun hasCachedData(): Boolean = data.machines.isNotEmpty() || data.alerts.isNotEmpty() || data.workOrders.isNotEmpty() || data.aiInsights.isNotEmpty()
    fun setCompactMode(enabled: Boolean) { compactMode = enabled; appContext?.getSharedPreferences(CACHE_PREFS, Context.MODE_PRIVATE)?.edit()?.putBoolean(CACHE_COMPACT, enabled)?.apply() }
    fun setShowAiInsights(enabled: Boolean) { showAiInsights = enabled; appContext?.getSharedPreferences(CACHE_PREFS, Context.MODE_PRIVATE)?.edit()?.putBoolean(CACHE_SHOW_AI, enabled)?.apply() }
    fun setSyncIntervalSeconds(seconds: Int) { syncIntervalSeconds = seconds.coerceIn(10, 60); appContext?.getSharedPreferences(CACHE_PREFS, Context.MODE_PRIVATE)?.edit()?.putInt(CACHE_SYNC_SECONDS, syncIntervalSeconds)?.apply() }'''
          if old_init in s:
              s = s.replace(old_init, new_init, 1)

          old_sync = '''    private suspend fun sync(silent: Boolean) {
        if (!silent) { loading = true; error = null }
        runCatching { MaintainRepository().load(serverUrl) }.onSuccess { data = it; lastUpdated = "Live" }.onFailure { if (!silent) error = it.message ?: "Unable to connect" }
        if (!silent) loading = false
    }'''
          new_sync = '''    private suspend fun sync(silent: Boolean) = syncMutex.withLock {
        if (!silent) { loading = true; error = null }
        runCatching { MaintainRepository().load(serverUrl) }
            .onSuccess {
                data = it
                lastUpdated = "Live"
                loading = false
                appContext?.let { context -> saveCachedData(context, it) }
            }
            .onFailure {
                loading = false
                if (!silent || !hasCachedData()) error = it.message ?: "Unable to connect"
            }
    }'''
          if old_sync in s:
              s = s.replace(old_sync, new_sync, 1)

          # Initialize VM from Compose context; cache hydrates before live fetch.
          old_app = '''fun MaintainApp(vm: MainViewModel = viewModel()) {
    val nav = rememberNavController()'''
          new_app = '''fun MaintainApp(vm: MainViewModel = viewModel()) {
    val context = androidx.compose.ui.platform.LocalContext.current
    LaunchedEffect(Unit) { vm.initialize(context) }
    val nav = rememberNavController()'''
          if old_app in s:
              s = s.replace(old_app, new_app, 1)

          # Make the last bottom-nav item Reports, keeping Work Orders independent from settings.
          old_items = '''        "analytics" to ("Analytics" to Icons.Default.Insights),
        "workorders" to ("Work Orders" to Icons.Default.Build),
        "more" to ("More" to Icons.Default.MoreHoriz)'''
          new_items = '''        "analytics" to ("Analytics" to Icons.Default.Insights),
        "workorders" to ("Work Orders" to Icons.Default.Build),
        "reports" to ("Reports" to Icons.Default.Assessment)'''
          s = s.replace(old_items, new_items, 1)

          # Make selected labels fit reliably on small phones.
          old_label = '''                        Text(
                            item.first,
                            color = Cyan,
                            style = MaterialTheme.typography.labelSmall,
                            fontWeight = FontWeight.SemiBold,
                            maxLines = 1,
                            modifier = Modifier.padding(top = 1.dp)
                        )'''
          new_label = '''                        Text(
                            item.first,
                            color = Cyan,
                            style = MaterialTheme.typography.labelSmall.copy(fontSize = 9.sp),
                            fontWeight = FontWeight.SemiBold,
                            maxLines = 1,
                            softWrap = false,
                            textAlign = TextAlign.Center,
                            modifier = Modifier.padding(top = 1.dp)
                        )'''
          s = s.replace(old_label, new_label, 1)

          # Reports is a real tab; More is no longer part of the main navigation.
          s = s.replace('                composable("more") { MoreScreen(vm.data, vm.serverUrl) { vm.updateServerUrl(it); vm.refresh() } }\n', '', 1)

          # Avoid duplicate-key crashes when malformed/legacy backend data contains repeated IDs.
          s = s.replace('items(vm.data.workOrders.take(3), key = { it.id })', 'items(vm.data.workOrders.take(3))', 1)
          s = s.replace('items(machines, key = { it.id })', 'items(machines)', 1)

          # Dashboard skeleton for the very first load only.
          marker = '@Composable\nprivate fun DashboardScreen(vm: MainViewModel) {'
          if 'private fun DashboardSkeleton()' not in s:
              skeleton = '''@Composable
private fun SkeletonBlock(modifier: Modifier) {
    Box(modifier.clip(RoundedCornerShape(12.dp)).background(Skeleton))
}

@Composable
private fun DashboardSkeleton() {
    LazyColumn(Modifier.fillMaxSize().padding(horizontal = 16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
        item { Spacer(Modifier.height(8.dp)); Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) { Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(8.dp)) { SkeletonBlock(Modifier.width(155.dp).height(24.dp)); SkeletonBlock(Modifier.width(125.dp).height(14.dp)) }; SkeletonBlock(Modifier.width(58.dp).height(28.dp)) } }
        item { SkeletonBlock(Modifier.fillMaxWidth().height(116.dp).clip(RoundedCornerShape(20.dp))) }
        item { Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) { repeat(3) { SkeletonBlock(Modifier.weight(1f).height(86.dp).clip(RoundedCornerShape(16.dp))) } } }
        item { Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(10.dp)) { repeat(2) { SkeletonBlock(Modifier.weight(1f).height(78.dp).clip(RoundedCornerShape(16.dp))) } } }
        item { SkeletonBlock(Modifier.fillMaxWidth().height(126.dp).clip(RoundedCornerShape(18.dp))) }
        item { SkeletonBlock(Modifier.fillMaxWidth().height(100.dp).clip(RoundedCornerShape(18.dp))) }
        item { SkeletonBlock(Modifier.fillMaxWidth().height(88.dp).clip(RoundedCornerShape(16.dp))) }
    }
}

'''
              s = s.replace(marker, skeleton + marker, 1)

          old_dashboard_start = '''private fun DashboardScreen(vm: MainViewModel) {
    val machines = vm.data.machines'''
          new_dashboard_start = '''private fun DashboardScreen(vm: MainViewModel) {
    if (vm.loading && !vm.data.machines.any() && !vm.data.alerts.any() && !vm.data.workOrders.any() && !vm.data.aiInsights.any()) {
        DashboardSkeleton()
        return
    }
    val machines = vm.data.machines'''
          s = s.replace(old_dashboard_start, new_dashboard_start, 1)

          # Compact mode controls dashboard density without changing content.
          s = s.replace('    val openOrders = vm.data.workOrders.count { it.status?.lowercase() != "completed" }\n    LazyColumn(Modifier.fillMaxSize().padding(horizontal = 16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {', '    val openOrders = vm.data.workOrders.count { it.status?.lowercase() != "completed" }\n    val sectionGap = if (vm.compactMode) 8.dp else 12.dp\n    LazyColumn(Modifier.fillMaxSize().padding(horizontal = 16.dp), verticalArrangement = Arrangement.spacedBy(sectionGap)) {', 1)

          # AI visibility preference.
          old_ai = '        item { SectionTitle("Predictive model", "Local model publication"); Spacer(Modifier.height(6.dp)); ModelPublicationCard(vm.data.modelStatus, vm.data.aiInsights) }'
          new_ai = '        if (vm.showAiInsights) item { SectionTitle("Predictive model", "Local model publication"); Spacer(Modifier.height(6.dp)); ModelPublicationCard(vm.data.modelStatus, vm.data.aiInsights) }'
          s = s.replace(old_ai, new_ai, 1)

          # Put a gear shortcut into the dashboard header; settings now contains only app customization/connection.
          old_header = 'item { Spacer(Modifier.height(8.dp)); Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) { Column(Modifier.weight(1f)) { Text("MAINTAIN AI", style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Bold); Text("Predictive maintenance", color = TextMuted) }; StatusPill("LIVE", Green) } }'
          new_header = 'item { Spacer(Modifier.height(8.dp)); Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) { Column(Modifier.weight(1f)) { Text("MAINTAIN AI", style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Bold); Text("Predictive maintenance", color = TextMuted) }; Row(verticalAlignment = Alignment.CenterVertically) { StatusPill("LIVE", Green); IconButton(onClick = onOpenSettings) { Icon(Icons.Default.Settings, "Settings", tint = TextMuted) } } } }'
          if old_header in s:
              s = s.replace('private fun DashboardScreen(vm: MainViewModel) {', 'private fun DashboardScreen(vm: MainViewModel, onOpenSettings: () -> Unit) {', 1)
              s = s.replace(old_header, new_header, 1)

          # Update Dashboard call site to supply settings navigation callback.
          s = s.replace('                composable("dashboard") { DashboardScreen(vm) }', '                composable("dashboard") { DashboardScreen(vm) { nav.navigate("settings") } }', 1)

          # Route the settings destination to a purpose-built customization screen.
          old_settings_route = '                composable("settings") { SettingsScreen(vm.serverUrl) { vm.updateServerUrl(it); vm.refresh() } }'
          new_settings_route = '                composable("settings") { CustomizationScreen(vm, vm.serverUrl) { vm.updateServerUrl(it); vm.refresh() } }'
          s = s.replace(old_settings_route, new_settings_route, 1)

          # Add a clean customization screen. Reports/Work Orders do not live inside it.
          if '@Composable\nprivate fun CustomizationScreen' not in s:
              customization = r'''

@Composable
private fun CustomizationScreen(vm: MainViewModel, url: String, onSaveUrl: (String) -> Unit) {
    var server by remember(url) { mutableStateOf(url) }
    LazyColumn(Modifier.fillMaxSize().padding(horizontal = 16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
        item { Spacer(Modifier.height(8.dp)); Text("Settings", style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Bold); Text("Customize the mobile experience", color = TextMuted) }
        item {
            Card(colors = CardDefaults.cardColors(containerColor = Surface), shape = RoundedCornerShape(18.dp)) {
                Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                    Text("Dashboard", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold)
                    Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                        Column(Modifier.weight(1f)) { Text("Compact layout", fontWeight = FontWeight.SemiBold); Text("Tighter spacing for smaller screens", color = TextMuted, style = MaterialTheme.typography.bodySmall) }
                        Switch(checked = vm.compactMode, onCheckedChange = vm::setCompactMode)
                    }
                    Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                        Column(Modifier.weight(1f)) { Text("Show AI insights", fontWeight = FontWeight.SemiBold); Text("Keep predictive model intelligence on the dashboard", color = TextMuted, style = MaterialTheme.typography.bodySmall) }
                        Switch(checked = vm.showAiInsights, onCheckedChange = vm::setShowAiInsights)
                    }
                }
            }
        }
        item {
            Card(colors = CardDefaults.cardColors(containerColor = Surface), shape = RoundedCornerShape(18.dp)) {
                Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                    Text("Automatic sync", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold)
                    Text("Choose how often the app refreshes in the background.", color = TextMuted, style = MaterialTheme.typography.bodySmall)
                    Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                        listOf(10, 30, 60).forEach { seconds ->
                            FilterChip(selected = vm.syncIntervalSeconds == seconds, onClick = { vm.setSyncIntervalSeconds(seconds) }, label = { Text("${seconds}s") }, modifier = Modifier.weight(1f))
                        }
                    }
                }
            }
        }
        item {
            Card(colors = CardDefaults.cardColors(containerColor = Surface), shape = RoundedCornerShape(18.dp)) {
                Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                    Text("Connection", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold)
                    OutlinedTextField(value = server, onValueChange = { server = it }, modifier = Modifier.fillMaxWidth(), singleLine = true, label = { Text("Backend URL") })
                    Button(onClick = { onSaveUrl(server) }, modifier = Modifier.fillMaxWidth()) { Icon(Icons.Default.Save, null); Spacer(Modifier.width(8.dp)); Text("Save connection") }
                }
            }
        }
        item { Text("Reports and Work Orders are separate sections now — they are not part of Settings.", color = TextMuted, style = MaterialTheme.typography.bodySmall, modifier = Modifier.padding(bottom = 20.dp)) }
    }
}
'''
              s += customization

          p.write_text(s)
          PY
      - name: Validate obvious patch markers
        run: |
          grep -q 'notificationPermissionLauncher' app/src/main/java/com/dmjgroup/maintainai/MainActivity.kt
          grep -q 'CustomizationScreen' app/src/main/java/com/dmjgroup/maintainai/MainActivity.kt
          grep -q 'private val syncMutex' app/src/main/java/com/dmjgroup/maintainai/MainActivity.kt
          grep -q '"reports" to ("Reports"' app/src/main/java/com/dmjgroup/maintainai/MainActivity.kt
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/dmjgroup/maintainai/MainActivity.kt
          git commit -m "Harden Android startup, cache dashboard, and customize UI [android-auto-patch]" || exit 0
          git push origin HEAD:main
