name: Fix Android build

on:
  push:
    paths:
      - '.github/workflows/fix-android-build.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/dmjgroup/maintainai/MainActivity.kt')
          text = path.read_text()
          text = text.replace('delay(30_000)', 'delay(10_000)')
          text = text.replace('Text(i.modelVersion ?: "AI", color = TextMuted, style = MaterialTheme.typography.labelSmall)', 'Text(i.modelVersion?.toString() ?: "AI", color = TextMuted, style = MaterialTheme.typography.labelSmall)')
          path.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/dmjgroup/maintainai/MainActivity.kt
          if git diff --cached --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git commit -m 'Fix Android build type mismatch and refresh interval'
          git push
