name: Repair Android navigation and startup

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch navigation and startup safety
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/dmjgroup/maintainai/MainActivity.kt')
          s = p.read_text()

          old_on_create = '''        createNotificationChannel()\n        scheduleAlertWorker()\n        if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {\n            registerForActivityResult(ActivityResultContracts.RequestPermission()) {}.launch(Manifest.permission.POST_NOTIFICATIONS)\n        }\n        setContent { MaintainApp() }'''
          new_on_create = '''        createNotificationChannel()\n        setContent { MaintainApp() }\n\n        // Background alert checks must never block or crash the main UI.\n        runCatching { scheduleAlertWorker() }\n\n        if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {\n            runCatching {\n                registerForActivityResult(ActivityResultContracts.RequestPermission()) {}\n                    .launch(Manifest.permission.POST_NOTIFICATIONS)\n            }\n        }'''
          if old_on_create not in s:
              raise SystemExit('onCreate pattern not found')
          s = s.replace(old_on_create, new_on_create, 1)

          start = s.index('@Composable\nprivate fun BottomNav(')
          end = s.index('\n@Composable\nprivate fun DashboardScreen', start)
          new_nav = '''@Composable\nprivate fun BottomNav(nav: NavHostController) {\n    val current = nav.currentBackStackEntryAsState().value?.destination?.route\n    val items = listOf(\n        "dashboard" to ("Overview" to Icons.Default.Dashboard),\n        "alerts" to ("Alerts" to Icons.Default.Notifications),\n        "analytics" to ("Analytics" to Icons.Default.Insights),\n        "workorders" to ("Work Orders" to Icons.Default.Build),\n        "more" to ("More" to Icons.Default.MoreHoriz)\n    )\n\n    Surface(color = Color(0xFF0C1727), shadowElevation = 8.dp) {\n        Row(\n            modifier = Modifier.fillMaxWidth().height(74.dp).padding(horizontal = 4.dp),\n            verticalAlignment = Alignment.CenterVertically\n        ) {\n            items.forEach { (route, item) ->\n                val selected = current == route\n                val iconSize = if (selected) 30.dp else 22.dp\n                Column(\n                    modifier = Modifier\n                        .weight(1f)\n                        .fillMaxHeight()\n                        .clickable {\n                            nav.navigate(route) {\n                                launchSingleTop = true\n                                popUpTo("dashboard") { saveState = true }\n                            }\n                        },\n                    horizontalAlignment = Alignment.CenterHorizontally,\n                    verticalArrangement = Arrangement.Center\n                ) {\n                    Box(\n                        modifier = Modifier\n                            .clip(RoundedCornerShape(14.dp))\n                            .background(if (selected) Cyan.copy(alpha = .12f) else Color.Transparent)\n                            .padding(horizontal = 11.dp, vertical = 4.dp),\n                        contentAlignment = Alignment.Center\n                    ) {\n                        Icon(\n                            item.second,\n                            contentDescription = item.first,\n                            tint = if (selected) Cyan else TextMuted,\n                            modifier = Modifier.size(iconSize)\n                        )\n                    }\n                    if (selected) {\n                        Text(\n                            item.first,\n                            color = Cyan,\n                            style = MaterialTheme.typography.labelSmall,\n                            fontWeight = FontWeight.SemiBold,\n                            maxLines = 1,\n                            modifier = Modifier.padding(top = 1.dp)\n                        )\n                    }\n                }\n            }\n        }\n    }\n}\n'''
          s = s[:start] + new_nav + s[end:]
          p.write_text(s)
          PY

      - name: Commit source repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/dmjgroup/maintainai/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m "Redesign Android bottom navigation and harden startup"
          git push
