name: Repair Android navigation and startup

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Finalize navigation fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/dmjgroup/maintainai/MainActivity.kt')
          s = p.read_text()
          needle = 'import androidx.compose.foundation.background\n'
          required = 'import androidx.compose.foundation.clickable\n'
          if required not in s:
              if needle not in s:
                  raise SystemExit('Compose background import not found')
              s = s.replace(needle, needle + required, 1)
              p.write_text(s)
          PY

      - name: Commit import fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-nav-crash.yml
          git add app/src/main/java/com/dmjgroup/maintainai/MainActivity.kt
          git commit -m "Fix navigation build and remove temporary repair workflow"
          git push origin HEAD:main
